# Projects on the research page (/research/), in the order they appear.
# Each project needs a title and a short description. Coauthors (a list) and
# status are optional; the status line accepts Markdown, e.g. *Political Behavior*.

- section: Political Economy
  projects:
    - title: "Campaign Giving Under Employment Threat: Federal Employees and the DOGE Workforce Reduction"
      status: Revise and resubmit at *Political Behavior*
      description: >-
        Does the threat of economic harm to government workers change their political giving?
        Using Federal Election Commission records and a difference-in-differences design that
        compares federal and non-federal donors in 2025 with the same weeks of 2017, I find that
        federal employees' Democratic giving fell most sharply in the early weeks of 2025, before
        any separations occurred, while their Republican giving showed no comparable decline. The
        pattern suggests that employment threats can reduce publicly disclosed opposition giving.

    - title: "Buying American Abroad: Political Identity and Consumer Choice"
      coauthors: [Donald P. Green]
      status: Work in progress
      description: >-
        Does America's standing in the world shape what consumers abroad buy? Using household-level
        purchase panels, we study how shifts in the United States' global reputation affect demand
        for American products.

    - title: "Claiming Corporate Success: Economic Exposure and Support for the Incumbent Party"
      status: Work in progress
      description: >-
        Does a president's public claim of credit for a company's success change political giving
        in the places where that company employs people? I combine LLM-coded presidential credit
        claims with local employment and stock-compensation exposure to publicly listed firms and
        with campaign-contribution records.

- section: AI Evaluation and Measurement
  projects:
    - title: "Better Questions for the Better Trained: LLM Memory and Unequal Research Advice"
      status: Working paper
      description: >-
        AI assistants now remember what users tell them, including how much training they have.
        Varying only what two LLMs remember about a Ph.D. student's mathematical preparation, this
        paper finds that blind LLM judges rate the research questions and plans suggested to more
        highly trained users as stronger, not merely harder, and argues that evaluations of
        personalized assistants should judge the strength of advice separately from its difficulty
        and feasibility.

    - title: "The Unequal Collapse of Disciplinary Barriers: Generative AI and the Reallocation of Scientific Talent"
      coauthors: [Gary Ziwen Zu]
      status: Work in progress
      description: >-
        Does generative AI lower the barriers to doing research outside one's own discipline, and
        for whom? We develop a formal model in which AI relaxes some capability constraints, such as
        codifiable domain knowledge, more than others, such as substantive judgment, and use it to
        predict who enters new fields and who produces high-quality research proposals. We are
        designing an experiment to test these predictions.

    - title: "Borrowed Battlegrounds: The Formation and Reorganization of Foreign-Language Event-Publics around U.S. Political Violence"
      status: Submitted
      description: >-
        How do foreign publics discuss political violence against American politicians? Studying
        29 U.S. political-violence events from 2010 to 2025 in five foreign-language communities on
        X, with LLM-labeled samples and a 1.3-million-post collection around the attacks on Donald
        Trump and Charlie Kirk, I find that even assassinations draw only short-lived attention
        abroad: most participants are first-time entrants whose activity fades within days, and
        views of the targeted politician's party do not change.

- section: Electoral Behavior
  projects:
    - title: "When Group Issues and Core Issues Collide: Evidence from Tailored Conjoint Experiments on Latino Voters"
      coauthors: [Yamil Velez]
      status: Revise and resubmit at *Political Behavior*
      description: >-
        How do Latino voters respond when candidates take different positions on group-related
        issues and on broader ideological or policy issues? Using tailored conjoint experiments, we
        study how voters weigh group attachments against other political considerations.

    - title: "Democracy Out of Sync: Circadian Misalignment and the Cost of Voting"
      coauthors: [John B. Holbein, Xuan Li]
      status: Under review
      description: >-
        How does time-zone-induced circadian misalignment affect the cost of voting? We examine
        whether biological and temporal constraints shape electoral participation.
